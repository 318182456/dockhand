name: Sync, Translate and Publish Docker

# 方案:中文化 overlay(运行时 DOM 翻译)
# 不再合并上游源码、不再自行编译前端。检测到上游发布新 tag 后,
# 直接基于官方镜像 fnsys/dockhand:<tag> 注入翻译脚本并重新发布。
# 本仓库源码仅作参考存档,构建不依赖它;已构建版本记录在 VERSION 文件。

on:
  workflow_dispatch: # 手动触发:强制重建当前最新上游版本(即使 VERSION 已一致)
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时检测一次上游 release

permissions:
  contents: write
  packages: write

jobs:
  build-zh-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect upstream release
        id: up
        run: |
          # 取上游版本号最大的 tag(ls-remote 不拉对象,轻量且不污染本仓库)
          LATEST=$(git ls-remote --refs --tags https://github.com/Finsys/dockhand.git 'v*' \
            | awk -F/ '{print $NF}' | sort -V | tail -n1)
          CURRENT=$(cat VERSION)
          echo "上游最新: ${LATEST},已构建: ${CURRENT}"
          if [ -z "$LATEST" ]; then
            echo "错误: 无法获取上游 tag"
            exit 1
          fi
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$LATEST" != "$CURRENT" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.up.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.up.outputs.build == 'true' && env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Log in to GitHub Container Registry
        if: steps.up.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: steps.up.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKER_USERNAME }}/dockhand
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.up.outputs.latest }}

      - name: Build and push zh overlay image
        if: steps.up.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.zh
          build-args: |
            UPSTREAM_VERSION=${{ steps.up.outputs.latest }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # overlay 构建只有秒级的注入操作,官方镜像层由 registry 缓存,无需 gha cache

      - name: Record built version
        # 镜像推送成功后才更新 VERSION,失败时下个周期自动重试
        if: steps.up.outputs.build == 'true' && steps.up.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "${{ steps.up.outputs.latest }}" > VERSION
          git add VERSION
          git commit -m "chore: 发布 ${{ steps.up.outputs.latest }} 中文化镜像"
          git push origin HEAD:main
