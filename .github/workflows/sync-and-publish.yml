name: Sync, Translate and Publish Docker

on:
  workflow_dispatch: # 支持手动触发构建
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动运行检测一次上游更新

permissions:
  contents: write
  packages: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Forked Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote and Sync
        id: sync
        run: |
          # 绑定上游官方库并拉取
          git remote add upstream https://github.com/Finsys/dockhand.git || true
          git fetch upstream --tags

          # 用 VERSION 文件判断是否有新版本：它反映的是"代码是否真正合进来"，
          # 而不是全库 tag 扫描（fetch --tags 会把未合并的 tag 也拉下来，导致误判，见历史 bug）
          LOCAL_VERSION=$(cat VERSION)
          UPSTREAM_VERSION=$(git show upstream/main:VERSION)
          echo "本地 VERSION: $LOCAL_VERSION，上游 VERSION: $UPSTREAM_VERSION"

          # 合并上游主分支。如有冲突必须让 job 失败并人工介入，
          # 绝不能 merge --abort 后继续推送/构建（会造成"tag 已推、代码没合"的假同步状态）
          git merge upstream/main --no-edit

          # 合并成功后才推送代码与 tags（顺序不能颠倒，否则 tag 先行污染判断）
          git push origin HEAD:main
          git push origin --tags

          if [ -n "$UPSTREAM_VERSION" ] && [ "$UPSTREAM_VERSION" != "$LOCAL_VERSION" ]; then
            echo "检测到上游新版本: $UPSTREAM_VERSION"
            echo "has_new_tag=true" >> $GITHUB_OUTPUT
          else
            echo "上游无新版本"
            echo "has_new_tag=false" >> $GITHUB_OUTPUT
          fi
          echo "latest_tag=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch' || steps.sync.outputs.has_new_tag == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Translate Script and Generate Lockfile
        if: github.event_name == 'workflow_dispatch' || steps.sync.outputs.has_new_tag == 'true'
        run: |
          # 动态中文化与依赖版本精确锁定
          node scripts/translate.js
          # 官方库中只包含 bun.lock 而没有 package-lock.json，但 Dockerfile 里硬编码了 COPY package-lock.json，我们需要生成一个以防止 Docker 报错
          npm install --package-lock-only --legacy-peer-deps

      # 移除了 QEMU 步骤，因为我们不再编译 arm64，只编 amd64

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.sync.outputs.has_new_tag == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: (github.event_name == 'workflow_dispatch' || steps.sync.outputs.has_new_tag == 'true') && env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch' || steps.sync.outputs.has_new_tag == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: github.event_name == 'workflow_dispatch' || steps.sync.outputs.has_new_tag == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKER_USERNAME }}/dockhand
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.sync.outputs.latest_tag }},enable=${{ steps.sync.outputs.latest_tag != '' }}
            type=sha,format=short

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || steps.sync.outputs.has_new_tag == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
